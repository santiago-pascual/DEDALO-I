<svg xmlns="http://www.w3.org/2000/svg" width="960" height="599" viewBox="0 0 960 599">
<rect width="100%" height="100%" fill="#f8fafc"/>
<g font-family="Arial, sans-serif">
<text x="32" y="40" font-size="25" font-weight="bold" fill="#14283e">Economic feasibility methodology</text>
<text x="32" y="67" font-size="14" fill="#475569">Archived conditional framework, not a forecast or native-fill simulation.</text>
<rect x="32" y="88" width="896" height="65" rx="5" fill="white" stroke="#cbd5e1"/>
<rect x="32" y="88" width="5" height="65" fill="#32738b"/>
<text x="50" y="113" font-size="17" font-weight="bold" fill="#14283e">01  Historical strategy outcome profiles</text>
<text x="50" y="135" font-size="14" fill="#475569">Reconstructed P5-R2 inputs</text>
<rect x="32" y="167" width="896" height="65" rx="5" fill="white" stroke="#cbd5e1"/>
<rect x="32" y="167" width="5" height="65" fill="#32738b"/>
<text x="50" y="192" font-size="17" font-weight="bold" fill="#14283e">02  Execution-cost assumptions</text>
<text x="50" y="214" font-size="14" fill="#475569">Adverse execution stress and modeled fees</text>
<rect x="32" y="246" width="896" height="65" rx="5" fill="white" stroke="#cbd5e1"/>
<rect x="32" y="246" width="5" height="65" fill="#32738b"/>
<text x="50" y="271" font-size="17" font-weight="bold" fill="#14283e">03  Dependence-aware bootstrap</text>
<text x="50" y="293" font-size="14" fill="#475569">Shared stationary-block session paths</text>
<rect x="32" y="325" width="896" height="65" rx="5" fill="white" stroke="#cbd5e1"/>
<rect x="32" y="325" width="5" height="65" fill="#32738b"/>
<text x="50" y="350" font-size="17" font-weight="bold" fill="#14283e">04  Account lifecycle simulation</text>
<text x="50" y="372" font-size="14" fill="#475569">Evaluation, loss constraints, replacement and activation</text>
<rect x="32" y="404" width="896" height="65" rx="5" fill="white" stroke="#cbd5e1"/>
<rect x="32" y="404" width="5" height="65" fill="#32738b"/>
<text x="50" y="429" font-size="17" font-weight="bold" fill="#14283e">05  Fees and payout constraints</text>
<text x="50" y="451" font-size="14" fill="#475569">Distinguish account balance from cash withdrawals</text>
<rect x="32" y="483" width="896" height="65" rx="5" fill="white" stroke="#cbd5e1"/>
<rect x="32" y="483" width="5" height="65" fill="#32738b"/>
<text x="50" y="508" font-size="17" font-weight="bold" fill="#14283e">06  Net economic outcomes</text>
<text x="50" y="530" font-size="14" fill="#475569">Distribution and downside; historical holiday-rule equivalence unverified</text>
</g></svg>
